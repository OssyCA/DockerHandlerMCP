[project]
name = "dockerhandlermcp"
version = "0.1.0"
description = "MCP project for DockHandler project"
readme = "README.md"
authors = [
    { name = "Ossy" }
]
requires-python = ">=3.15"
dependencies = [
    "fastmcp>=4.2.4",
    "httpx>=0.28.1",
    "truststore>=0.10.5",
]

[project.scripts]
dockerhandlermcp = "dockerhandlermcp:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
